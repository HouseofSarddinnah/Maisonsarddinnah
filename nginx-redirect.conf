# Nginx Configuration for 301 Redirect
# Redirects all www traffic to non-www canonical domain

# HTTP to HTTPS and www to non-www redirect
server {
    listen 80;
    listen [::]:80;
    server_name www.maisonsarddinnah.com maisonsarddinnah.com;
    
    # Redirect all HTTP to HTTPS non-www
    return 301 https://maisonsarddinnah.com$request_uri;
}

# HTTPS www to non-www redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.maisonsarddinnah.com;
    
    # SSL certificate configuration (update with your certificate paths)
    ssl_certificate /path/to/your/certificate.crt;
    ssl_certificate_key /path/to/your/private.key;
    
    # Redirect HTTPS www to HTTPS non-www
    return 301 https://maisonsarddinnah.com$request_uri;
}

# Main server block (canonical non-www HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maisonsarddinnah.com;
    
    # SSL certificate configuration (update with your certificate paths)
    ssl_certificate /path/to/your/certificate.crt;
    ssl_certificate_key /path/to/your/private.key;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    # Root directory
    root /var/www/maisonsarddinnah.com;
    index index.html;
    
    # Main location block
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
